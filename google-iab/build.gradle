plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'games.moisoni.google_iab'
    compileSdkVersion 37

    defaultConfig {
        // Google Play Billing 9.1.0 requires API 23 or newer.
        minSdkVersion 23
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = "com.github.mertkaradeniz1"
                artifactId = "google-inapp-billing"
                version = project.findProperty("version") ?: "1.0.0"
            }
        }
    }
}

dependencies {
    // These types appear in the public API, so expose their compile dependencies.
    api libs.billing
    api libs.lifecycle.common
    api libs.annotation
    testImplementation libs.junit
}